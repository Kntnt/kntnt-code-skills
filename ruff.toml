# Ruff runs unpinned in .pre-commit-config.yaml and in CI (`uvx ruff check .`),
# so the version resolved is whatever is current on the day. Without a config
# the rule set is ruff's default, and that default is not a stable contract:
# ruff 0.16.4 widened it from roughly 60 rules to 413, turning a green tree red
# on 31 findings in code nobody had touched. Selecting the rule set explicitly
# makes the gate mean one thing regardless of which ruff runs it.

[lint]
select = ["E4", "E7", "E9", "F"]

repos:
  - repo: local
    hooks:
      - id: audit
        name: kntnt-code-skills audit
        entry: uv run scripts/audit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: tests
        name: kntnt-code-skills tests
        entry: uv run --with pytest pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

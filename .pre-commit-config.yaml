repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: kntnt-code-skills ruff check
        entry: uvx ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ruff-format
        name: kntnt-code-skills ruff format check
        entry: uvx ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: mypy
        name: kntnt-code-skills mypy
        entry: uv run --with mypy --with pytest mypy scripts tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: audit
        name: kntnt-code-skills audit
        entry: uv run scripts/audit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: tests
        name: kntnt-code-skills tests
        # Scrub the git location vars before pytest as defence-in-depth: this
        # hook exports them, and they would redirect the doctor/init test
        # fixtures' git at the real repo. tests/conftest.py scrubs them too.
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR uv run --with pytest pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
